<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Fireside</title>
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0d0907" />
    <!-- added to the Home Screen it opens as an app, with no browser bars -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Fireside" />
    <!-- dark from the very first paint, before any stylesheet arrives -->
    <style>
      html {
        background: #0d0907;
      }
    </style>
    <meta
      name="description"
      content="A cozy pixel-art simulation: a firelit clearing at night, where a last knight keeps his vigil and a village of shroomfolk tends the fire."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="caidan.dev" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://fireside.caidan.dev/" />
    <meta property="og:title" content="Fireside" />
    <meta
      property="og:description"
      content="A cozy pixel-art simulation: a firelit clearing at night, where a last knight keeps his vigil and a village of shroomfolk tends the fire."
    />
    <meta property="og:image" content="https://fireside.caidan.dev/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="A campfire in a dark forest clearing: a knight sits by it, a deer stands close, and mushroom huts glow behind them."
    />
    <!-- on X, the post plays the scene itself (/embed/, framed inside it): see docs/research/x-player-card.md -->
    <meta name="twitter:card" content="player" />
    <meta name="twitter:site" content="@caidanwilliams" />
    <meta name="twitter:creator" content="@caidanwilliams" />
    <meta name="twitter:player" content="https://fireside.caidan.dev/embed/" />
    <meta name="twitter:player:width" content="640" />
    <meta name="twitter:player:height" content="360" />
    <meta name="twitter:image" content="https://fireside.caidan.dev/card-player.png" />
    <link rel="canonical" href="https://fireside.caidan.dev/" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/internet-development/www-server-mono@latest/server-mono.css" />
    <link rel="stylesheet" href="/styles/reset.css" />
    <link rel="stylesheet" href="/styles/base.css" />
    <link rel="stylesheet" href="/styles/page.css" />
  </head>
  <body>
    <div id="app">
      <div class="bar">
        <p class="hint">
          <span class="by-pointer">hover to discover the story · click and drag to carry things</span>
          <span class="by-touch">tap to see · drag to carry</span>
        </p>
        <div class="controls">
          <div class="sound">
            <button type="button" class="control" data-toggle="sound" aria-pressed="false" aria-label="Sound" title="Sound (S)">
              <svg data-icon="sound-on" class="icon on"></svg>
              <svg data-icon="sound-off" class="icon off"></svg>
            </button>
            <input id="volume" type="range" min="0" max="1" step="0.05" value="0.7" aria-label="Volume" title="Volume" />
          </div>
          <button type="button" class="control" data-toggle="paused" aria-pressed="false" aria-label="Pause" title="Pause (space)">
            <svg data-icon="pause" class="icon playing"></svg>
            <svg data-icon="play" class="icon paused"></svg>
          </button>
          <button type="button" class="control" id="fullscreen" aria-label="Fullscreen" title="Fullscreen" hidden>
            <svg data-icon="fullscreen"></svg>
          </button>
        </div>
      </div>

      <div class="stage">
        <!-- before anything moves: one obvious way in (it starts the scene, the sound and the story) -->
        <div class="veil" id="veil">
          <button type="button" class="control begin" id="begin">
            <svg data-icon="play"></svg>
            <span>sit by the fire</span>
          </button>
        </div>
        <canvas id="canvas" aria-label="A pixel-art forest clearing at night: a campfire, a resting knight, shroomfolk, a deer and a rain pool."></canvas>
      </div>

      <ol id="story" class="story" role="log" aria-live="polite" aria-label="What happens in the clearing"></ol>

      <footer class="credit">
        Created by <a href="https://caidan.dev" target="_blank" rel="noopener">Caidan</a> at
        <a href="https://internet.dev" target="_blank" rel="noopener">INTDEV</a>
      </footer>
    </div>
    <script type="module" src="/src/page/main.ts"></script>
  </body>
</html>
