<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fireside</title>
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="noindex" />
    <!-- The scene alone, for a frame inside a post on X (the home page's player card:
         docs/research/x-player-card.md). It starts at once: X shows a still and a play button first. -->
    <style>
      html {
        background: #0d0907;
      }
    </style>
    <link rel="stylesheet" href="/styles/reset.css" />
    <link rel="stylesheet" href="/styles/base.css" />
    <link rel="stylesheet" href="/styles/page.css" />
    <link rel="stylesheet" href="/styles/embed.css" />
  </head>
  <body>
    <main class="frame">
      <canvas id="canvas" aria-label="A pixel-art forest clearing at night: a campfire, a resting knight, shroomfolk, a deer and a rain pool"></canvas>
    </main>
    <div class="corner">
      <button type="button" class="control" data-toggle="sound" aria-pressed="false" aria-label="Sound" title="Sound (S)">
        <svg data-icon="sound-on" class="icon on"></svg>
        <svg data-icon="sound-off" class="icon off"></svg>
      </button>
      <a class="control" href="https://fireside.caidan.dev/" target="_blank" rel="noopener" aria-label="Open Fireside" title="Open Fireside">
        <svg data-icon="open"></svg>
      </a>
    </div>
    <script type="module" src="/src/page/embed.ts"></script>
  </body>
</html>
