<!doctype html>

    <title>Fireside</title>
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0d0907" />
    <!-- added to the Home Screen it opens as an app, with no browser bars -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Fireside" />
    <!-- dark from the very first paint, before any stylesheet arrives -->
    <style>
      html {
        background: #0d0907;
      }
    </style>
    <meta
      name="description"
      content="A cozy pixel-art simulation: a firelit clearing at night, where a last knight keeps his vigil and a village of shroomfolk tends the fire."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://fireside.caidan.dev/" />
    <meta property="og:title" content="Fireside" />
    <meta
      property="og:description"
      content="A cozy pixel-art simulation: a firelit clearing at night, where a last knight keeps his vigil and a village of shroomfolk tends the fire."
    />
    <meta property="og:image" content="https://fireside.caidan.dev/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="A campfire in a dark forest clearing: a knight sits by it, a deer stands close, and mushroom huts glow behind them."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="canonical" href="https://fireside.caidan.dev/" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />

    <div id="app">

            <input id="volume" type="range" min="0" max="1" step="0.05" value="0.7" aria-label="Volume" title="Volume" />
          </div>
          <button type="button" class="control" data-toggle="paused" aria-pressed="false" aria-label="Pause" title="Pause (space)">
            <svg class="icon playing" viewBox="0 0 6 8" width="12" height="16" shape-rendering="crispEdges" aria-hidden="true">

        <div class="veil" id="veil">
          <button type="button" class="control begin" id="begin">
            <svg viewBox="0 0 7 9" width="17.5" height="22.5" shape-rendering="crispEdges" aria-hidden="true">
              <rect x="0" y="0" width="1" height="1" />

            <span>sit by the fire</span>
