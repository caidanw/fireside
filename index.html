<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fireside</title>
    <meta name="color-scheme" content="dark" />
    <!-- dark from the very first paint, before any stylesheet arrives -->
    <style>
      html {
        background: #0d0907;
      }
    </style>
    <meta
      name="description"
      content="A cozy pixel-art simulation: a firelit clearing at night, where a last knight keeps his vigil and a village of shroomfolk tends the fire."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://fireside.caidan.dev/" />
    <meta property="og:title" content="Fireside" />
    <meta
      property="og:description"
      content="A cozy pixel-art simulation: a firelit clearing at night, where a last knight keeps his vigil and a village of shroomfolk tends the fire."
    />
    <link rel="canonical" href="https://fireside.caidan.dev/" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/internet-development/www-server-mono@latest/server-mono.css" />
    <link rel="stylesheet" href="/src/reset.css" />
    <link rel="stylesheet" href="/src/base.css" />
    <link rel="stylesheet" href="/src/page.css" />
  </head>
  <body>
    <div id="app">
      <div class="bar">
        <p class="hint">hover to discover the story · click the ground to drop a stick</p>
        <div class="controls">
          <div class="sound">
            <button type="button" class="control" data-toggle="sound" aria-pressed="false" aria-label="Sound" title="Sound (S)">
              <svg class="icon on" viewBox="0 0 10 8" width="20" height="16" shape-rendering="crispEdges" aria-hidden="true">
                <rect x="4" y="0" width="1" height="1" />
                <rect x="3" y="1" width="1" height="1" />
                <rect x="4" y="1" width="1" height="1" />
                <rect x="7" y="1" width="1" height="1" />
                <rect x="0" y="2" width="1" height="1" />
                <rect x="1" y="2" width="1" height="1" />
                <rect x="2" y="2" width="1" height="1" />
                <rect x="3" y="2" width="1" height="1" />
                <rect x="4" y="2" width="1" height="1" />
                <rect x="8" y="2" width="1" height="1" />
                <rect x="0" y="3" width="1" height="1" />
                <rect x="1" y="3" width="1" height="1" />
                <rect x="2" y="3" width="1" height="1" />
                <rect x="3" y="3" width="1" height="1" />
                <rect x="4" y="3" width="1" height="1" />
                <rect x="6" y="3" width="1" height="1" />
                <rect x="9" y="3" width="1" height="1" />
                <rect x="0" y="4" width="1" height="1" />
                <rect x="1" y="4" width="1" height="1" />
                <rect x="2" y="4" width="1" height="1" />
                <rect x="3" y="4" width="1" height="1" />
                <rect x="4" y="4" width="1" height="1" />
                <rect x="6" y="4" width="1" height="1" />
                <rect x="9" y="4" width="1" height="1" />
                <rect x="0" y="5" width="1" height="1" />
                <rect x="1" y="5" width="1" height="1" />
                <rect x="2" y="5" width="1" height="1" />
                <rect x="3" y="5" width="1" height="1" />
                <rect x="4" y="5" width="1" height="1" />
                <rect x="8" y="5" width="1" height="1" />
                <rect x="3" y="6" width="1" height="1" />
                <rect x="4" y="6" width="1" height="1" />
                <rect x="7" y="6" width="1" height="1" />
                <rect x="4" y="7" width="1" height="1" />
              </svg>
              <svg class="icon off" viewBox="0 0 10 8" width="20" height="16" shape-rendering="crispEdges" aria-hidden="true">
                <rect x="4" y="0" width="1" height="1" />
                <rect x="3" y="1" width="1" height="1" />
                <rect x="4" y="1" width="1" height="1" />
                <rect x="0" y="2" width="1" height="1" />
                <rect x="1" y="2" width="1" height="1" />
                <rect x="2" y="2" width="1" height="1" />
                <rect x="3" y="2" width="1" height="1" />
                <rect x="4" y="2" width="1" height="1" />
                <rect x="6" y="2" width="1" height="1" />
                <rect x="9" y="2" width="1" height="1" />
                <rect x="0" y="3" width="1" height="1" />
                <rect x="1" y="3" width="1" height="1" />
                <rect x="2" y="3" width="1" height="1" />
                <rect x="3" y="3" width="1" height="1" />
                <rect x="4" y="3" width="1" height="1" />
                <rect x="7" y="3" width="1" height="1" />
                <rect x="8" y="3" width="1" height="1" />
                <rect x="0" y="4" width="1" height="1" />
                <rect x="1" y="4" width="1" height="1" />
                <rect x="2" y="4" width="1" height="1" />
                <rect x="3" y="4" width="1" height="1" />
                <rect x="4" y="4" width="1" height="1" />
                <rect x="7" y="4" width="1" height="1" />
                <rect x="8" y="4" width="1" height="1" />
                <rect x="0" y="5" width="1" height="1" />
                <rect x="1" y="5" width="1" height="1" />
                <rect x="2" y="5" width="1" height="1" />
                <rect x="3" y="5" width="1" height="1" />
                <rect x="4" y="5" width="1" height="1" />
                <rect x="6" y="5" width="1" height="1" />
                <rect x="9" y="5" width="1" height="1" />
                <rect x="3" y="6" width="1" height="1" />
                <rect x="4" y="6" width="1" height="1" />
                <rect x="4" y="7" width="1" height="1" />
              </svg>
            </button>
            <input id="volume" type="range" min="0" max="1" step="0.05" value="0.7" aria-label="Volume" title="Volume" />
          </div>
          <button type="button" class="control" data-toggle="paused" aria-pressed="false" aria-label="Pause" title="Pause (space)">
            <svg class="icon playing" viewBox="0 0 6 8" width="12" height="16" shape-rendering="crispEdges" aria-hidden="true">
              <rect x="0" y="0" width="1" height="1" />
              <rect x="1" y="0" width="1" height="1" />
              <rect x="4" y="0" width="1" height="1" />
              <rect x="5" y="0" width="1" height="1" />
              <rect x="0" y="1" width="1" height="1" />
              <rect x="1" y="1" width="1" height="1" />
              <rect x="4" y="1" width="1" height="1" />
              <rect x="5" y="1" width="1" height="1" />
              <rect x="0" y="2" width="1" height="1" />
              <rect x="1" y="2" width="1" height="1" />
              <rect x="4" y="2" width="1" height="1" />
              <rect x="5" y="2" width="1" height="1" />
              <rect x="0" y="3" width="1" height="1" />
              <rect x="1" y="3" width="1" height="1" />
              <rect x="4" y="3" width="1" height="1" />
              <rect x="5" y="3" width="1" height="1" />
              <rect x="0" y="4" width="1" height="1" />
              <rect x="1" y="4" width="1" height="1" />
              <rect x="4" y="4" width="1" height="1" />
              <rect x="5" y="4" width="1" height="1" />
              <rect x="0" y="5" width="1" height="1" />
              <rect x="1" y="5" width="1" height="1" />
              <rect x="4" y="5" width="1" height="1" />
              <rect x="5" y="5" width="1" height="1" />
              <rect x="0" y="6" width="1" height="1" />
              <rect x="1" y="6" width="1" height="1" />

              <rect x="5" y="6" width="1" height="1" />

              <rect x="4" y="7" width="1" height="1" />
              <rect x="5" y="7" width="1" height="1" />
            </svg>
            <svg class="icon paused" viewBox="0 0 6 8" width="12" height="16" shape-rendering="crispEdges" aria-hidden="true">
              <rect x="0" y="0" width="1" height="1" />
              <rect x="0" y="1" width="1" height="1" />
              <rect x="1" y="1" width="1" height="1" />
              <rect x="2" y="1" width="1" height="1" />
              <rect x="0" y="2" width="1" height="1" />
              <rect x="1" y="2" width="1" height="1" />
              <rect x="2" y="2" width="1" height="1" />
              <rect x="3" y="2" width="1" height="1" />
              <rect x="4" y="2" width="1" height="1" />
              <rect x="0" y="3" width="1" height="1" />
              <rect x="1" y="3" width="1" height="1" />
              <rect x="2" y="3" width="1" height="1" />
              <rect x="3" y="3" width="1" height="1" />
              <rect x="4" y="3" width="1" height="1" />
              <rect x="5" y="3" width="1" height="1" />
              <rect x="0" y="4" width="1" height="1" />
              <rect x="1" y="4" width="1" height="1" />
              <rect x="2" y="4" width="1" height="1" />
              <rect x="3" y="4" width="1" height="1" />
              <rect x="4" y="4" width="1" height="1" />
              <rect x="5" y="4" width="1" height="1" />
              <rect x="0" y="5" width="1" height="1" />
              <rect x="1" y="5" width="1" height="1" />
              <rect x="2" y="5" width="1" height="1" />
              <rect x="3" y="5" width="1" height="1" />
              <rect x="4" y="5" width="1" height="1" />
              <rect x="0" y="6" width="1" height="1" />
              <rect x="1" y="6" width="1" height="1" />
              <rect x="2" y="6" width="1" height="1" />
              <rect x="0" y="7" width="1" height="1" />
            </svg>
          </button>
        </div>
      </div>

      <div class="stage">
        <!-- before anything moves: one obvious way in (it starts the scene, the sound and the story) -->
        <div class="veil" id="veil">
          <button type="button" class="control begin" id="begin">
            <svg viewBox="0 0 6 8" width="15" height="20" shape-rendering="crispEdges" aria-hidden="true">
              <rect x="0" y="0" width="1" height="1" />
              <rect x="0" y="1" width="1" height="1" />
              <rect x="1" y="1" width="1" height="1" />
              <rect x="2" y="1" width="1" height="1" />
              <rect x="0" y="2" width="1" height="1" />
              <rect x="1" y="2" width="1" height="1" />
              <rect x="2" y="2" width="1" height="1" />
              <rect x="3" y="2" width="1" height="1" />
              <rect x="4" y="2" width="1" height="1" />
              <rect x="0" y="3" width="1" height="1" />
              <rect x="1" y="3" width="1" height="1" />
              <rect x="2" y="3" width="1" height="1" />
              <rect x="3" y="3" width="1" height="1" />
              <rect x="4" y="3" width="1" height="1" />
              <rect x="5" y="3" width="1" height="1" />
              <rect x="0" y="4" width="1" height="1" />
              <rect x="1" y="4" width="1" height="1" />
              <rect x="2" y="4" width="1" height="1" />
              <rect x="3" y="4" width="1" height="1" />
              <rect x="4" y="4" width="1" height="1" />
              <rect x="5" y="4" width="1" height="1" />
              <rect x="0" y="5" width="1" height="1" />
              <rect x="1" y="5" width="1" height="1" />
              <rect x="2" y="5" width="1" height="1" />
              <rect x="3" y="5" width="1" height="1" />
              <rect x="4" y="5" width="1" height="1" />
              <rect x="0" y="6" width="1" height="1" />
              <rect x="1" y="6" width="1" height="1" />
              <rect x="2" y="6" width="1" height="1" />
              <rect x="0" y="7" width="1" height="1" />
            </svg>
            <span>sit by the fire</span>
          </button>
        </div>
        <canvas id="canvas" aria-label="A pixel-art forest clearing at night: a campfire, a resting knight, shroomfolk, a deer and a rain pool."></canvas>
      </div>

      <ol id="story" class="story" role="log" aria-live="polite" aria-label="What happens in the clearing"></ol>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
