<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fireside</title>
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="noindex" />
    <!-- The scene alone, for a frame inside a post on X (its player card: see /x/ and
         docs/research/x-player-card.md). It starts at once: X shows a still and a play button first. -->
    <style>
      html {
        background: #0d0907;
      }
    </style>
    <link rel="stylesheet" href="/src/reset.css" />
    <link rel="stylesheet" href="/src/base.css" />
    <link rel="stylesheet" href="/src/page.css" />
    <link rel="stylesheet" href="/src/embed.css" />
  </head>
  <body>
    <main class="frame">
      <canvas id="canvas" aria-label="A pixel-art forest clearing at night: a campfire, a resting knight, shroomfolk, a deer and a rain pool"></canvas>
    </main>
    <div class="corner">
      <button type="button" class="control" data-toggle="sound" aria-pressed="false" aria-label="Sound" title="Sound (S)">
        <svg class="icon on" viewBox="0 0 10 8" width="20" height="16" shape-rendering="crispEdges" aria-hidden="true">
          <rect x="4" y="0" width="1" height="1" />
          <rect x="3" y="1" width="1" height="1" />
          <rect x="4" y="1" width="1" height="1" />
          <rect x="7" y="1" width="1" height="1" />

          <rect x="2" y="2" width="1" height="1" />
          <rect x="3" y="2" width="1" height="1" />
          <rect x="4" y="2" width="1" height="1" />
          <rect x="8" y="2" width="1" height="1" />

          <rect x="1" y="3" width="1" height="1" />
          <rect x="2" y="3" width="1" height="1" />
          <rect x="3" y="3" width="1" height="1" />
          <rect x="4" y="3" width="1" height="1" />
          <rect x="6" y="3" width="1" height="1" />
          <rect x="9" y="3" width="1" height="1" />
          <rect x="0" y="4" width="1" height="1" />
          <rect x="1" y="4" width="1" height="1" />

          <rect x="4" y="4" width="1" height="1" />
          <rect x="6" y="4" width="1" height="1" />
          <rect x="9" y="4" width="1" height="1" />
          <rect x="0" y="5" width="1" height="1" />
          <rect x="1" y="5" width="1" height="1" />
          <rect x="2" y="5" width="1" height="1" />
          <rect x="3" y="5" width="1" height="1" />
          <rect x="4" y="5" width="1" height="1" />
          <rect x="8" y="5" width="1" height="1" />
          <rect x="3" y="6" width="1" height="1" />
          <rect x="4" y="6" width="1" height="1" />
          <rect x="7" y="6" width="1" height="1" />
          <rect x="4" y="7" width="1" height="1" />
        </svg>
        <svg class="icon off" viewBox="0 0 10 8" width="20" height="16" shape-rendering="crispEdges" aria-hidden="true">
          <rect x="4" y="0" width="1" height="1" />
          <rect x="3" y="1" width="1" height="1" />
          <rect x="4" y="1" width="1" height="1" />
          <rect x="0" y="2" width="1" height="1" />
          <rect x="1" y="2" width="1" height="1" />
          <rect x="2" y="2" width="1" height="1" />

      </button>
      <a class="control" href="https://fireside.caidan.dev/" target="_blank" rel="noopener" aria-label="Open Fireside" title="Open Fireside">
        <svg viewBox="0 0 8 8" width="14" height="14" fill="currentColor" shape-rendering="crispEdges" aria-hidden="true">
          <rect x="3" y="0" width="1" height="1" />
          <rect x="4" y="0" width="1" height="1" />
          <rect x="5" y="0" width="1" height="1" />
          <rect x="6" y="0" width="1" height="1" />
          <rect x="7" y="0" width="1" height="1" />
          <rect x="6" y="1" width="1" height="1" />
          <rect x="7" y="1" width="1" height="1" />
          <rect x="5" y="2" width="1" height="1" />
          <rect x="7" y="2" width="1" height="1" />
          <rect x="4" y="3" width="1" height="1" />
          <rect x="7" y="3" width="1" height="1" />
          <rect x="3" y="4" width="1" height="1" />
          <rect x="2" y="5" width="1" height="1" />
          <rect x="1" y="6" width="1" height="1" />
          <rect x="0" y="7" width="1" height="1" />
        </svg>
      </a>
    </div>
    <script type="module" src="/src/embed.ts"></script>
  </body>
</html>
